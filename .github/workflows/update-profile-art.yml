name: Update profile art
"on":
  schedule:
    - cron: "17 6 * * *" # ~06:17 UTC diario
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/fetch_contributions.py"
      - "scripts/render_heatmap_svg.py"
      - "scripts/requirements.txt"
      - ".github/workflows/update-profile-art.yml"

# Permisos mínimos: solo escribir contenido del repo.
permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: true

jobs:
  heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions fijadas por SHA de commit (no por etiqueta movible).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap_svg.py
      - uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
